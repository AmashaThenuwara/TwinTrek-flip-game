spring.application.name=TwinTrek_FLIP_Game

# --- MySQL Database Configuration ---
# Make sure you have created a database named 'twintrek_db' in your MySQL server
spring.datasource.url=jdbc:mysql://localhost:3306/twintrek_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# --- Hibernate Properties ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console since we are using MySQL now
spring.h2.console.enabled=false

server.port=8080
